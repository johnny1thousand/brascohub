<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Tracker</title>
<style>
  :root {
    --bg: #C9CBCF;
    --surface: #E9EAEC;
    --card: #FBFBFC;
    --card-2: #F1F2F4;
    --ink: #1A2730;
    --muted: #6E7883;
    --line: #E3E5E8;
    --accent: #E95D2C;   /* brand / primary action */
    --sky: #B0CEE2;      /* calm / all-clear */
    --green: #45586C;    /* on track (slate) */
    --amber: #A63E1B;    /* due soon (rust) */
    --red: #E95D2C;      /* overdue / alert */
    --radius: 22px;
    --radius-sm: 14px;
    --shadow: 0 8px 22px rgba(20,22,26,.07), 0 1px 2px rgba(0,0,0,.04);
    --shadow-sm: 0 3px 10px rgba(20,22,26,.06);
    --sans: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body { font-family: var(--sans); background: var(--bg); color: var(--ink); line-height: 1.45; -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 22px; }
  .surface { background: var(--surface); border-radius: 30px; padding: 22px; box-shadow: inset 0 1px 0 rgba(255,255,255,.5); }

  /* ---------- top bar ---------- */
  .topbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; margin-bottom: 8px; }
  .brand-logo { height: 40px; width: auto; display: block; }
  .segments { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .seg { background: transparent; border: none; color: var(--muted); font: inherit; font-weight: 600; font-size: 14px; padding: 9px 18px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .seg:hover { color: var(--ink); }
  .seg.active { background: var(--card); color: var(--ink); box-shadow: var(--shadow-sm); }
  .seg.add { color: var(--muted); font-size: 18px; padding: 9px 14px; }
  .top-right { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
  .odo-pill { background: var(--card); border-radius: 999px; padding: 9px 16px; box-shadow: var(--shadow-sm); font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 7px; }
  .odo-pill small { color: var(--muted); font-weight: 600; }
  .btn-green { background: var(--accent); color: #fff; border: none; font: inherit; font-weight: 700; font-size: 14px; padding: 11px 18px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 6px 16px rgba(233,93,44,.30); }
  .btn-green:hover { background: #d24d20; }
  .btn-green:disabled { opacity: .6; cursor: default; }
  .icon-btn { width: 42px; height: 42px; border-radius: 12px; background: var(--card); border: none; box-shadow: var(--shadow-sm); cursor: pointer; display: grid; place-items: center; font-size: 17px; color: var(--ink); }
  .icon-btn:hover { background: var(--card-2); }

  /* ---------- sync status ---------- */
  .sync-pill { background: var(--card); border-radius: 999px; padding: 9px 14px; box-shadow: var(--shadow-sm); font-weight: 700; font-size: 12.5px; display: flex; align-items: center; gap: 7px; color: var(--muted); white-space: nowrap; }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #CDD1D6; flex: none; }
  .sync-pill.saved .sync-dot { background: var(--green); }
  .sync-pill.saving .sync-dot { background: var(--sky); }
  .sync-pill.offline .sync-dot { background: var(--amber); }
  .sync-pill.error .sync-dot { background: var(--red); }

  /* ---------- login screen ---------- */
  .login-screen { position: fixed; inset: 0; background: var(--bg); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 200; }
  .login-screen.open { display: flex; }
  .login-card { background: var(--card); border-radius: 26px; padding: 34px 30px; width: 100%; max-width: 360px; box-shadow: var(--shadow); text-align: center; }
  .login-card .brand-logo { height: 56px; margin: 0 auto 14px; }
  .login-card h1 { font-size: 22px; font-weight: 800; letter-spacing: -.4px; }
  .login-card .hint { margin: 8px 0 20px; }
  .login-card label { text-align: left; }
  .login-card input { margin-bottom: 14px; }
  .login-card button { width: 100%; justify-content: center; margin-top: 4px; }
  .login-error { background: rgba(233,93,44,.12); color: var(--accent); font-size: 13px; font-weight: 700; padding: 10px 12px; border-radius: 10px; margin-bottom: 16px; text-align: left; }

  /* ---------- hero ---------- */
  .hero-main { position: relative; margin-top: 18px; }
  .hero-stage { position: relative; min-height: 340px; border-radius: 26px; overflow: hidden; background: linear-gradient(180deg, #EFF0F2, #E4E6E9); box-shadow: inset 0 1px 0 rgba(255,255,255,.6); }
  .hero-scrim { position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: linear-gradient(100deg, rgba(238,239,241,.94) 0%, rgba(238,239,241,.6) 34%, rgba(238,239,241,0) 60%); }
  .hero-info { position: absolute; top: 26px; left: 28px; z-index: 3; max-width: 60%; }
  .hero-name { font-size: 40px; font-weight: 800; letter-spacing: -1px; line-height: 1.05; }
  .hero-sub { color: var(--muted); font-size: 15px; margin-top: 6px; font-weight: 500; }
  .chips { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; font-weight: 700; box-shadow: var(--shadow-sm); }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; }
  .chip.ok { color: var(--green); } .chip.ok .dot { background: var(--green); }
  .chip.warn { color: var(--amber); } .chip.warn .dot { background: var(--amber); }
  .chip.overdue { color: var(--red); } .chip.overdue .dot { background: var(--red); }
  .chip.plain { color: var(--muted); }
  .hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
  .hero-photobtn { position: absolute; right: 18px; bottom: 18px; z-index: 4; background: rgba(251,251,252,.9); backdrop-filter: blur(6px); border: none; border-radius: 999px; padding: 9px 15px; font: inherit; font-weight: 700; font-size: 13px; cursor: pointer; box-shadow: var(--shadow-sm); display: inline-flex; align-items: center; gap: 7px; }
  .hero-photobtn:hover { background: #fff; }
  .placeholder-car { position: absolute; inset: 0; display: grid; place-items: center; z-index: 1; }
  .placeholder-car svg { width: 62%; max-width: 460px; opacity: .5; }

  /* ---------- info card row ---------- */
  .cards-row { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 16px; margin-top: 16px; }
  .info { background: var(--card); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); }
  .info-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .info-title { font-size: 13px; color: var(--muted); font-weight: 700; }
  .info-expand { color: var(--muted); font-size: 14px; }
  .info.spot { background: var(--ink); color: #fff; }
  .info.spot .info-title { color: rgba(255,255,255,.6); }
  .spot-name { font-size: 22px; font-weight: 800; letter-spacing: -.4px; }
  .spot-metric { color: rgba(255,255,255,.75); font-size: 14px; margin-top: 4px; }
  .info.spot.due { background: var(--sky); color: var(--ink); }
  .info.spot.due .info-title { color: rgba(26,39,48,.55); }
  .info.spot.due .spot-metric { color: rgba(26,39,48,.7); }
  .spot.warn2 { background: var(--amber); } .spot.over { background: var(--red); }
  .big-num { font-size: 34px; font-weight: 800; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
  .big-num small { font-size: 14px; color: var(--muted); font-weight: 600; margin-left: 6px; letter-spacing: 0; }

  /* ---------- maintenance ---------- */
  .sec-head { display: flex; align-items: center; justify-content: space-between; margin: 28px 4px 14px; }
  .sec-head h2 { font-size: 19px; font-weight: 800; letter-spacing: -.3px; }
  .sec-head .pill { background: var(--card); border: none; box-shadow: var(--shadow-sm); color: var(--ink); font: inherit; font-weight: 700; font-size: 13px; padding: 8px 14px; border-radius: 999px; cursor: pointer; }
  .sec-head .count { color: var(--muted); font-size: 14px; font-weight: 600; }
  .mgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .mcard { background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); cursor: pointer; text-align: left; border: none; font: inherit; display: flex; flex-direction: column; gap: 14px; min-height: 130px; }
  .mcard:hover { transform: translateY(-2px); transition: transform .15s; }
  .mcard-top { display: flex; align-items: flex-start; justify-content: space-between; }
  .mcard .num { font-size: 26px; font-weight: 800; letter-spacing: -.5px; line-height: 1; font-variant-numeric: tabular-nums; }
  .mcard .unit { display: block; font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .3px; margin-top: 4px; }
  .status-dot { width: 12px; height: 12px; border-radius: 50%; margin-top: 4px; }
  .mcard.ok .num { color: var(--green); } .mcard.ok .status-dot { background: var(--green); }
  .mcard.warn .num { color: var(--amber); } .mcard.warn .status-dot { background: var(--amber); }
  .mcard.overdue .num { color: var(--red); } .mcard.overdue .status-dot { background: var(--red); }
  .mcard.none .num { color: #B7BCC3; } .mcard.none .status-dot { background: #CDD1D6; }
  .mcard .name { font-size: 15px; font-weight: 700; }
  .mcard .last { font-size: 12px; color: var(--muted); margin-top: 3px; }

  /* ---------- history ---------- */
  .hist { display: flex; flex-direction: column; gap: 10px; }
  .hrow { background: var(--card); border-radius: var(--radius-sm); padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 14px; box-shadow: var(--shadow-sm); }
  .hrow .hname { font-weight: 700; font-size: 15px; }
  .hrow .hmeta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .hrow .hnotes { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .hright { display: flex; align-items: center; gap: 14px; white-space: nowrap; }
  .hcost { font-weight: 800; color: var(--green); font-size: 15px; }
  .hacts { display: flex; gap: 6px; }
  .mini { width: 32px; height: 32px; border-radius: 10px; background: var(--card-2); border: none; color: var(--muted); cursor: pointer; font-size: 13px; }
  .mini:hover { color: var(--ink); } .mini.del:hover { color: var(--red); }
  .empty { text-align: center; color: var(--muted); padding: 40px; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
  .empty .big { font-size: 38px; }

  /* ---------- modals ---------- */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(30,33,38,.35); backdrop-filter: blur(4px); display: none; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 70; overflow-y: auto; }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--card); border-radius: 24px; width: 100%; max-width: 520px; box-shadow: 0 30px 60px rgba(20,22,26,.25); }
  .modal > header { display: flex; align-items: center; justify-content: space-between; padding: 20px 22px; border-bottom: 1px solid var(--line); }
  .modal > header h2 { font-size: 18px; font-weight: 800; }
  .modal .body { padding: 22px; }
  .modal .footer { padding: 16px 22px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-grid .full { grid-column: 1 / -1; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 700; }
  select, input, textarea { font-family: inherit; font-size: 14px; color: var(--ink); background: var(--card-2); border: 1px solid transparent; border-radius: 12px; padding: 11px 13px; width: 100%; }
  select:focus, input:focus, textarea:focus { outline: none; border-color: var(--green); background: #fff; }
  textarea { resize: vertical; min-height: 62px; }
  button { font-family: inherit; font-size: 14px; }
  .modal button, .btn { cursor: pointer; border-radius: 12px; padding: 11px 16px; font-weight: 700; border: 1px solid var(--line); background: var(--card-2); color: var(--ink); }
  .modal button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .modal button.ghost { background: transparent; }
  .modal button.icon { padding: 7px 10px; background: none; border: none; color: var(--muted); font-size: 16px; }
  .modal button.danger.ghost:hover { border-color: var(--red); color: var(--red); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; background: var(--card-2); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; font-weight: 600; cursor: pointer; user-select: none; }
  .switch.on { box-shadow: inset 0 0 0 2px var(--accent); }
  .switch input { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }
  .list-btn { display: block; width: 100%; text-align: left; background: var(--card-2); border: none; color: var(--ink); padding: 14px 16px; border-radius: 12px; margin-bottom: 10px; font: inherit; font-weight: 600; cursor: pointer; }
  .list-btn:hover { background: #E9EAEC; }

  #intervalsList table { width: 100%; border-collapse: collapse; }
  #intervalsList th, #intervalsList td { text-align: left; padding: 8px; font-size: 13px; border-bottom: 1px solid var(--line); }
  #intervalsList th { color: var(--muted); font-size: 11px; text-transform: uppercase; }
  #intervalsList input { padding: 7px 9px; }

  #toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 16px); background: var(--ink); color: #fff; border-radius: 12px; padding: 13px 20px; font-size: 13.5px; font-weight: 600; box-shadow: 0 14px 30px rgba(0,0,0,.25); z-index: 100; max-width: 92vw; text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 900px) {
    .cards-row { grid-template-columns: 1fr; }
    .mgrid { grid-template-columns: repeat(2, 1fr); }
    .hero-name { font-size: 30px; }
    .hero-info { max-width: 90%; }
  }
  @media (max-width: 560px) {
    .topbar { grid-template-columns: auto 1fr; }
    .segments { grid-column: 1 / -1; order: 3; justify-content: flex-start; overflow-x: auto; }
    .mgrid { grid-template-columns: 1fr; }
    .btn-green span { display: none; }
    .sync-pill span:last-child { display: none; }

    /* standalone hero photo: no text overlay, no photo controls */
    .hero-stage { min-height: 160px; }
    .hero-scrim, .hero-photobtn { display: none; }
    .hero-info { position: static; max-width: 100%; margin-top: 14px; padding: 0 2px; }
    .hero-name { font-size: 24px; }
  }
</style>
</head>

<script>
(function () {
  "use strict";
  var STORAGE_KEY = "carTracker.v1";
  var API_BASE = "api/";

  var DEFAULT_INTERVALS = [
    { id: "oil", name: "Oil change", miles: 5000, months: 6 },
    { id: "tires", name: "Tire rotation", miles: 6000, months: 6 },
    { id: "brakes", name: "Brakes (pads)", miles: 40000, months: 36 },
    { id: "plugs", name: "Spark plugs", miles: 30000, months: 36 },
    { id: "air", name: "Engine air filter", miles: 20000, months: 24 },
    { id: "cabin", name: "Cabin air filter", miles: 15000, months: 12 },
    { id: "coolant", name: "Coolant flush", miles: 50000, months: 60 },
    { id: "trans", name: "Transmission fluid", miles: 60000, months: 60 }
  ];

  var idCounter = 0;
  var db = load();
  var editingServiceId = null;
  var editingVehicleId = null;
  var authed = false;
  var saveTimer = null;

  function load() {
    try { var raw = localStorage.getItem(STORAGE_KEY); if (raw) { var p = JSON.parse(raw); if (p && p.vehicles) return normalize(p); } }
    catch (e) { console.warn(e); }
    return seed();
  }
  function normalize(d) {
    d.vehicles.forEach(function (v) { if (!v.services) v.services = []; if (!v.intervals) v.intervals = cloneIntervals(); });
    if (!d.currentVehicleId && d.vehicles[0]) d.currentVehicleId = d.vehicles[0].id;
    if (!d.settings) d.settings = {};
    return d;
  }
  function seed() { var v = newVehicle("My Car"); return { vehicles: [v], currentVehicleId: v.id, settings: {} }; }
  function persistLocal() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch (e) { alert("Could not save: " + e.message + (String(e).indexOf("quota") > -1 ? " — try a smaller photo." : "")); } }
  function save() { persistLocal(); scheduleServerSave(); }
  function cloneIntervals() { return DEFAULT_INTERVALS.map(function (i) { return Object.assign({}, i); }); }
  function uid() { return "id" + Math.random().toString(36).slice(2, 9) + (idCounter++); }
  function newVehicle(name) { return { id: uid(), name: name || "My Car", year: "", make: "", model: "", photo: "", currentMiles: null, services: [], intervals: cloneIntervals() }; }

  function currentVehicle() { return db.vehicles.find(function (v) { return v.id === db.currentVehicleId; }) || db.vehicles[0]; }
  function fmtDate(iso) { if (!iso) return "—"; var d = new Date(iso + "T00:00:00"); return isNaN(d) ? iso : d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }); }
  function todayISO() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function nowStamp() { var d = new Date(), p = function (n) { return String(n).padStart(2, "0"); }; return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()); }
  function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
  function addMonths(iso, m) { var d = new Date(iso + "T00:00:00"); d.setMonth(d.getMonth() + m); return d; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function titleCase(s) { return String(s || "").toLowerCase().replace(/\b\w/g, function (c) { return c.toUpperCase(); }); }

  function milesPerDay(v) {
    var pts = [];
    v.services.forEach(function (s) { if (s.mileage != null && s.mileage !== "" && s.date) pts.push({ date: s.date, miles: Number(s.mileage) }); });
    if (v.currentMiles != null && v.currentMiles !== "") pts.push({ date: todayISO(), miles: Number(v.currentMiles) });
    pts.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    if (pts.length < 2) return null;
    var f = pts[0], l = pts[pts.length - 1];
    var dM = l.miles - f.miles, dD = daysBetween(new Date(f.date + "T00:00:00"), new Date(l.date + "T00:00:00"));
    if (dD <= 0 || dM <= 0) return null;
    return dM / dD;
  }
  function latestOdometer(v) {
    var max = (v.currentMiles != null && v.currentMiles !== "") ? Number(v.currentMiles) : null;
    v.services.forEach(function (s) { if (s.mileage != null && s.mileage !== "") max = Math.max(max == null ? -Infinity : max, Number(s.mileage)); });
    return max === -Infinity ? null : max;
  }
  function computeStatus(v, iv, mpd, odo) {
    var rel = v.services.filter(function (s) { return s.typeId === iv.id; });
    rel.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    var last = rel[0];
    if (!last) return { state: "none", last: null, detail: "", pct: 0 };
    var reasons = [], pct = 0, worst = "ok";
    var lm = (last.mileage != null && last.mileage !== "") ? Number(last.mileage) : null;
    if (iv.miles && lm != null && odo != null) {
      var used = odo - lm, mp = used / iv.miles; pct = Math.max(pct, mp);
      var remain = iv.miles - used;
      if (remain <= 0) { worst = "overdue"; reasons.push("Overdue by " + Math.abs(remain).toLocaleString() + " mi"); }
      else { var dd = mpd ? new Date(Date.now() + (remain / mpd) * 86400000) : null; var msg = "In " + remain.toLocaleString() + " mi"; if (dd) msg += " (~" + dd.toLocaleDateString(undefined, { month: "short", year: "numeric" }) + ")"; if (mp >= 0.85 && worst === "ok") worst = "warn"; reasons.push(msg); }
    }
    if (iv.months && last.date) {
      var due = addMonths(last.date, iv.months), now = new Date();
      var tot = due - new Date(last.date + "T00:00:00"), u = now - new Date(last.date + "T00:00:00");
      var tp = tot > 0 ? u / tot : 1; pct = Math.max(pct, tp);
      if (now >= due) { worst = "overdue"; reasons.push("Time overdue"); }
      else { var dl = daysBetween(now, due); if (tp >= 0.85 && worst === "ok") worst = "warn"; if (dl <= 45) reasons.push("Due in " + dl + " days"); }
    }
    return { state: worst, last: last, detail: reasons.join(" · ") || "On track", pct: Math.min(1.2, pct) };
  }
  function primaryMetric(iv, st, odo) {
    if (!st.last) return { num: "—", unit: "no record" };
    var lm = (st.last.mileage != null && st.last.mileage !== "") ? Number(st.last.mileage) : null;
    if (iv.miles && lm != null && odo != null) { var r = iv.miles - (odo - lm); return r < 0 ? { num: Math.abs(r).toLocaleString(), unit: "mi over" } : { num: r.toLocaleString(), unit: "mi left" }; }
    if (iv.months && st.last.date) { var d = daysBetween(new Date(), addMonths(st.last.date, iv.months)); return d < 0 ? { num: Math.abs(d), unit: "days over" } : { num: d, unit: "days left" }; }
    return { num: "✓", unit: "logged" };
  }

  var CAR_SVG = '<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" fill="none"><path d="M60 150h520M120 150c0-22 18-40 40-40s40 18 40 40M440 150c0-22 18-40 40-40s40 18 40 40" stroke="#9AA0A8" stroke-width="6" stroke-linecap="round"/><path d="M95 150c0-14-2-38 14-52 20-18 60-30 120-30 55 0 90 20 120 44 18 14 60 20 96 26 24 4 40 12 40 30 0 6-4 12-14 12" stroke="#9AA0A8" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="160" cy="150" r="26" stroke="#9AA0A8" stroke-width="6"/><circle cx="480" cy="150" r="26" stroke="#9AA0A8" stroke-width="6"/><path d="M180 82c40-6 78-4 110 14" stroke="#9AA0A8" stroke-width="5" stroke-linecap="round"/></svg>';

  // ---------- render ----------
  function render() {
    var v = currentVehicle(); if (!v) return;
    var mpd = milesPerDay(v), odo = latestOdometer(v);
    var statuses = v.intervals.map(function (iv) { return { iv: iv, st: computeStatus(v, iv, mpd, odo) }; });
    var order = { overdue: 0, warn: 1, ok: 2, none: 3 };
    statuses.sort(function (a, b) { return order[a.st.state] !== order[b.st.state] ? order[a.st.state] - order[b.st.state] : b.st.pct - a.st.pct; });
    var overdue = statuses.filter(function (s) { return s.st.state === "overdue"; }).length;
    var soon = statuses.filter(function (s) { return s.st.state === "warn"; }).length;
    var okCount = statuses.filter(function (s) { return s.st.state === "ok"; }).length;

    renderSegments(v);
    document.getElementById("odoPill").innerHTML = "<span>" + (odo != null ? Number(odo).toLocaleString() : "—") + "</span><small>mi</small>";
    renderHero(v, statuses, okCount, soon, overdue);
    renderCards(v, statuses, mpd, odo, overdue, soon);
    renderMaintenance(statuses, odo);
    renderHistory(v);
  }

  function renderSegments(v) {
    var h = "";
    db.vehicles.forEach(function (x) { h += '<button class="seg' + (x.id === v.id ? ' active' : '') + '" data-veh="' + x.id + '">' + esc(x.name) + '</button>'; });
    h += '<button class="seg add" data-action="add-car" title="Add a car">＋</button>';
    document.getElementById("segments").innerHTML = h;
  }

  function renderHero(v, statuses, okCount, soon, overdue) {
    var sub = [v.year, v.make, v.model].filter(Boolean).join(" ") || "Add your car details";
    var chips = "";
    if (okCount) chips += '<span class="chip ok"><span class="dot"></span>' + okCount + " on track</span>";
    if (soon) chips += '<span class="chip warn"><span class="dot"></span>' + soon + " due soon</span>";
    if (overdue) chips += '<span class="chip overdue"><span class="dot"></span>' + overdue + " overdue</span>";
    if (!chips) chips = '<span class="chip plain">No services logged yet</span>';

    var imgLayer = v.photo
      ? '<img class="hero-img" src="' + esc(v.photo) + '" alt="' + esc(v.name) + '"><div class="hero-scrim"></div>'
      : '<div class="placeholder-car">' + CAR_SVG + '</div>';

    document.getElementById("heroStage").innerHTML =
      imgLayer +
      '<button class="hero-photobtn" id="heroPhotoBtn">📷 ' + (v.photo ? "Change photo" : "Add photo") + '</button>';
    document.getElementById("heroPhotoBtn").onclick = function () { document.getElementById("photoInput").click(); };

    document.getElementById("heroInfo").innerHTML =
      '<div class="hero-name">' + esc(v.name) + '</div>' +
      '<div class="hero-sub">' + esc(sub) + '</div><div class="chips">' + chips + '</div>';
  }

  function renderCards(v, statuses, mpd, odo, overdue, soon) {
    var top = statuses.find(function (s) { return s.st.state === "overdue"; }) || statuses.find(function (s) { return s.st.state === "warn"; });
    var spotCls = "info spot " + (overdue ? "over" : soon ? "warn2" : "due");
    var spotHtml;
    if (!v.services.length) {
      spotHtml = '<div class="' + "info spot" + '"><div class="info-head"><span class="info-title">GET STARTED</span></div>' +
        '<div class="spot-name">Log your first service</div><div class="spot-metric">Tap “Log service” above</div></div>';
    } else if (top) {
      var m = primaryMetric(top.iv, top.st, odo);
      spotHtml = '<button class="' + spotCls + '" data-log-type="' + esc(top.iv.id) + '" style="text-align:left;border:none;cursor:pointer;width:100%">' +
        '<div class="info-head"><span class="info-title">' + (overdue ? "OVERDUE" : "DUE SOON") + '</span><span class="info-expand">↗</span></div>' +
        '<div class="spot-name">' + esc(top.iv.name) + '</div><div class="spot-metric">' + esc(m.num) + ' ' + esc(m.unit) + '</div></button>';
    } else {
      spotHtml = '<div class="info spot due"><div class="info-head"><span class="info-title">ALL CAUGHT UP</span></div>' +
        '<div class="spot-name">Nothing due</div><div class="spot-metric">Everything on track</div></div>';
    }
    var odoCard = '<div class="info"><div class="info-head"><span class="info-title">Odometer</span></div>' +
      '<div class="big-num">' + (odo != null ? Number(odo).toLocaleString() : "—") + '<small>miles</small></div></div>';
    var rateCard = '<div class="info"><div class="info-head"><span class="info-title">Driving rate</span></div>' +
      '<div class="big-num">' + (mpd != null ? Math.round(mpd * 30).toLocaleString() : "—") + '<small>mi / mo</small></div></div>';
    document.getElementById("cardsRow").innerHTML = spotHtml + odoCard + rateCard;
  }

  function renderMaintenance(statuses, odo) {
    document.getElementById("mgrid").innerHTML = statuses.map(function (s) {
      var m = primaryMetric(s.iv, s.st, odo);
      var last = s.st.last ? ("Last " + fmtDate(s.st.last.date)) : "Not logged — tap to add";
      return '<button class="mcard ' + s.st.state + '" data-log-type="' + esc(s.iv.id) + '">' +
        '<div class="mcard-top"><div><span class="num">' + esc(String(m.num)) + '</span><span class="unit">' + esc(m.unit) + '</span></div><span class="status-dot"></span></div>' +
        '<div><div class="name">' + esc(s.iv.name) + '</div><div class="last">' + esc(last) + '</div></div></button>';
    }).join("");
  }

  function serviceName(v, s) { if (s.typeId === "custom") return s.customName || "Other"; var iv = v.intervals.find(function (i) { return i.id === s.typeId; }); return iv ? iv.name : (s.customName || "Other"); }

  function renderHistory(v) {
    document.getElementById("histCount").textContent = v.services.length + (v.services.length === 1 ? " entry" : " entries");
    if (!v.services.length) { document.getElementById("histWrap").innerHTML = '<div class="empty"><div class="big">🧾</div>No services logged yet.</div>'; return; }
    var rows = v.services.slice().sort(function (a, b) { if (a.date !== b.date) return a.date < b.date ? 1 : -1; return (b.mileage || 0) - (a.mileage || 0); });
    var h = '<div class="hist">';
    rows.forEach(function (s) {
      var meta = fmtDate(s.date);
      if (s.mileage != null && s.mileage !== "") meta += " · " + Number(s.mileage).toLocaleString() + " mi";
      if (s.time) meta += " · " + esc(s.time);
      var cost = (s.cost != null && s.cost !== "") ? "$" + Number(s.cost).toFixed(2) : "";
      h += '<div class="hrow"><div><div class="hname">' + esc(serviceName(v, s)) + '</div><div class="hmeta">' + meta + '</div>' +
        (s.notes ? '<div class="hnotes">' + esc(s.notes) + '</div>' : '') + '</div>' +
        '<div class="hright">' + (cost ? '<div class="hcost">' + cost + '</div>' : '') +
        '<div class="hacts"><button class="mini" data-edit-service="' + s.id + '">✎</button><button class="mini del" data-del-service="' + s.id + '">✕</button></div></div></div>';
    });
    h += '</div>';
    document.getElementById("histWrap").innerHTML = h;
  }

  // ---------- photo ----------
  function handlePhoto(file) {
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      var max = 1100, scale = Math.min(1, max / img.width);
      var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      var c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      currentVehicle().photo = c.toDataURL("image/jpeg", 0.82);
      save(); render(); showToast("✓ Photo updated");
    };
    img.onerror = function () { URL.revokeObjectURL(url); alert("Could not read that image."); };
    img.src = url;
  }

  // ---------- service modal ----------
  function populateTypeSelect(v, selectedId) {
    var sel = document.getElementById("svcType"); sel.innerHTML = "";
    v.intervals.forEach(function (iv) { var o = document.createElement("option"); o.value = iv.id; o.textContent = iv.name; sel.appendChild(o); });
    var oc = document.createElement("option"); oc.value = "custom"; oc.textContent = "Other / custom…"; sel.appendChild(oc);
    sel.value = selectedId || v.intervals[0].id; toggleCustom();
  }
  function toggleCustom() { document.getElementById("customTypeWrap").style.display = document.getElementById("svcType").value === "custom" ? "block" : "none"; }
  function openServiceModal(serviceId, presetType) {
    var v = currentVehicle(); editingServiceId = serviceId || null;
    document.getElementById("serviceModalTitle").textContent = serviceId ? "Edit Service" : "Log a Service";
    populateTypeSelect(v, presetType);
    var s = serviceId ? v.services.find(function (x) { return x.id === serviceId; }) : null;
    document.getElementById("svcType").value = s ? s.typeId : (presetType || v.intervals[0].id); toggleCustom();
    document.getElementById("svcCustomType").value = s ? (s.customName || "") : "";
    document.getElementById("svcDate").value = s ? s.date : todayISO();
    document.getElementById("svcMileage").value = s && s.mileage != null ? s.mileage : "";
    document.getElementById("svcTime").value = s ? (s.time || "") : "";
    document.getElementById("svcCost").value = s && s.cost != null ? s.cost : "";
    document.getElementById("svcNotes").value = s ? (s.notes || "") : "";
    openModal("serviceModal");
    setTimeout(function () { document.getElementById("svcMileage").focus(); }, 50);
  }
  function saveService() {
    var v = currentVehicle();
    var typeId = document.getElementById("svcType").value;
    var date = document.getElementById("svcDate").value;
    if (!date) { alert("Please pick a date."); return; }
    var customName = document.getElementById("svcCustomType").value.trim();
    if (typeId === "custom" && !customName) { alert("Please enter a name for the custom service."); return; }
    var mr = document.getElementById("svcMileage").value, cr = document.getElementById("svcCost").value;
    var payload = { typeId: typeId, customName: typeId === "custom" ? customName : "", date: date, mileage: mr === "" ? null : Number(mr), time: document.getElementById("svcTime").value.trim(), cost: cr === "" ? null : Number(cr), notes: document.getElementById("svcNotes").value.trim() };
    if (editingServiceId) Object.assign(v.services.find(function (x) { return x.id === editingServiceId; }), payload);
    else { payload.id = uid(); v.services.push(payload); }
    if (payload.mileage != null && (v.currentMiles == null || payload.mileage > v.currentMiles) && date <= todayISO()) v.currentMiles = payload.mileage;
    save(); closeModal("serviceModal"); render();
  }
  function deleteService(id) {
    var v = currentVehicle(); var s = v.services.find(function (x) { return x.id === id; }); if (!s) return;
    if (!confirm("Delete this " + serviceName(v, s) + " record from " + fmtDate(s.date) + "?")) return;
    v.services = v.services.filter(function (x) { return x.id !== id; }); save(); render();
  }

  // ---------- vehicle modal ----------
  function openVehicleModal(vehicleId) {
    editingVehicleId = vehicleId || null; var isEdit = !!vehicleId;
    document.getElementById("vehicleModalTitle").textContent = isEdit ? "Edit Car" : "Add Car";
    document.getElementById("deleteVehicleBtn").style.display = (isEdit && db.vehicles.length > 1) ? "inline-block" : "none";
    var v = isEdit ? db.vehicles.find(function (x) { return x.id === vehicleId; }) : null;
    document.getElementById("vehName").value = v ? v.name : "";
    document.getElementById("vehYear").value = v ? (v.year || "") : "";
    document.getElementById("vehMake").value = v ? (v.make || "") : "";
    document.getElementById("vehModel").value = v ? (v.model || "") : "";
    document.getElementById("vehMiles").value = v && v.currentMiles != null ? v.currentMiles : "";
    openModal("vehicleModal");
  }
  function saveVehicle() {
    var name = document.getElementById("vehName").value.trim();
    var year = document.getElementById("vehYear").value.trim();
    var make = document.getElementById("vehMake").value.trim();
    var model = document.getElementById("vehModel").value.trim();
    var mr = document.getElementById("vehMiles").value;
    if (!name && !make && !model) { alert("Please give the car a name."); return; }
    var data = { name: name || [year, make, model].filter(Boolean).join(" ") || "My Car", year: year, make: make, model: model, currentMiles: mr === "" ? null : Number(mr) };
    if (editingVehicleId) Object.assign(db.vehicles.find(function (x) { return x.id === editingVehicleId; }), data);
    else { var nv = newVehicle(data.name); Object.assign(nv, data); db.vehicles.push(nv); db.currentVehicleId = nv.id; }
    save(); closeModal("vehicleModal"); render();
  }
  function deleteVehicle() {
    if (db.vehicles.length <= 1) { alert("You need at least one car."); return; }
    var v = db.vehicles.find(function (x) { return x.id === editingVehicleId; }); if (!v) return;
    if (!confirm("Delete \"" + v.name + "\" and all its records? This cannot be undone.")) return;
    db.vehicles = db.vehicles.filter(function (x) { return x.id !== editingVehicleId; });
    if (db.currentVehicleId === editingVehicleId) db.currentVehicleId = db.vehicles[0].id;
    save(); closeModal("vehicleModal"); render();
  }

  // ---------- intervals ----------
  function openIntervalsModal() {
    var v = currentVehicle();
    var h = '<table><thead><tr><th>Service</th><th style="width:96px">Every (mi)</th><th style="width:96px">Every (mo)</th></tr></thead><tbody>';
    v.intervals.forEach(function (iv, i) { h += '<tr><td>' + esc(iv.name) + '</td><td><input type="number" min="0" data-iv-miles="' + i + '" value="' + (iv.miles || "") + '"></td><td><input type="number" min="0" data-iv-months="' + i + '" value="' + (iv.months || "") + '"></td></tr>'; });
    h += '</tbody></table>';
    document.getElementById("intervalsList").innerHTML = h; openModal("intervalsModal");
  }
  function saveIntervals() {
    var v = currentVehicle();
    document.querySelectorAll("[data-iv-miles]").forEach(function (i) { v.intervals[+i.getAttribute("data-iv-miles")].miles = i.value === "" ? 0 : Number(i.value); });
    document.querySelectorAll("[data-iv-months]").forEach(function (i) { v.intervals[+i.getAttribute("data-iv-months")].months = i.value === "" ? 0 : Number(i.value); });
    save(); closeModal("intervalsModal"); render();
  }

  // ---------- export (backup copy, as a spreadsheet-friendly CSV) ----------
  function plural(n, w) { return n + " " + w + (n === 1 ? "" : "s"); }
  function csvCell(v) { return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; }
  function exportData() {
    var rows = [["Vehicle", "Service", "Date", "Odometer (mi)", "Time spent", "Cost ($)", "Notes"]];
    var count = 0;
    db.vehicles.forEach(function (v) {
      v.services.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; }).forEach(function (s) {
        rows.push([v.name, serviceName(v, s), s.date || "", s.mileage != null ? s.mileage : "", s.time || "", s.cost != null ? s.cost : "", s.notes || ""]);
        count++;
      });
    });
    var csv = rows.map(function (r) { return r.map(csvCell).join(","); }).join("\r\n");
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = "car-tracker-history-" + todayISO() + ".csv";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    showToast("✓ CSV saved — " + plural(count, "service") + ". Check your downloads folder.");
  }

  var toastTimer = null;
  function showToast(msg) { var t = document.getElementById("toast"); if (!t) { t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); } t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 4000); }
  function openModal(id) { document.getElementById(id).classList.add("open"); }
  function closeModal(id) { document.getElementById(id).classList.remove("open"); }

  // ---------- server sync & auth ----------
  function setSyncStatus(state, text) {
    var pill = document.getElementById("syncPill");
    var label = { saving: "Saving…", saved: "Saved", offline: "Offline — saved locally", error: "Save failed" }[state] || state;
    pill.className = "sync-pill " + state;
    document.getElementById("syncText").textContent = text || label;
  }

  function scheduleServerSave() {
    if (!authed) return;
    clearTimeout(saveTimer);
    setSyncStatus("saving");
    saveTimer = setTimeout(pushToServer, 800);
  }

  function pushToServer() {
    fetch(API_BASE + "save.php", { method: "POST", credentials: "include", headers: { "Content-Type": "application/json" }, body: JSON.stringify(db) })
      .then(function (r) {
        if (r.status === 401) { authed = false; showLogin(); throw new Error("logged out"); }
        if (!r.ok) throw new Error("save failed");
        setSyncStatus("saved");
      })
      .catch(function () { setSyncStatus("offline"); });
  }

  function applyRemoteData(data) {
    if (data && data.vehicles && data.vehicles.length) { db = normalize(data); persistLocal(); render(); }
  }

  function loadFromServer() {
    return fetch(API_BASE + "load.php", { credentials: "include" })
      .then(function (r) {
        if (r.status === 401) { authed = false; showLogin(); return null; }
        if (!r.ok) throw new Error("load failed");
        authed = true; hideLogin();
        return r.json();
      })
      .then(function (res) { if (res) { applyRemoteData(res.data); setSyncStatus("saved"); } });
  }

  function boot() {
    loadFromServer().catch(function () { setSyncStatus("offline", "Offline — showing saved data"); });
  }

  function showLogin() { document.getElementById("loginScreen").classList.add("open"); }
  function hideLogin() { document.getElementById("loginScreen").classList.remove("open"); document.getElementById("loginError").style.display = "none"; }

  function doLogin() {
    var username = document.getElementById("loginUser").value.trim();
    var password = document.getElementById("loginPass").value;
    var btn = document.getElementById("loginBtn");
    var err = document.getElementById("loginError");
    err.style.display = "none";
    if (!username || !password) return;
    btn.disabled = true;
    fetch(API_BASE + "login.php", { method: "POST", credentials: "include", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: username, password: password }) })
      .then(function (r) { return r.json().then(function (body) { return { ok: r.ok, body: body }; }); })
      .then(function (res) {
        btn.disabled = false;
        if (!res.ok) { err.textContent = (res.body && res.body.error) || "Login failed."; err.style.display = "block"; return; }
        document.getElementById("loginPass").value = "";
        authed = true;
        loadFromServer();
      })
      .catch(function () { btn.disabled = false; err.textContent = "Could not reach the server. Check your connection."; err.style.display = "block"; });
  }

  function doLogout() {
    fetch(API_BASE + "logout.php", { method: "POST", credentials: "include" }).catch(function () {});
    authed = false;
    closeModal("settingsModal");
    showLogin();
  }

  // ---------- events ----------
  document.getElementById("segments").addEventListener("click", function (e) {
    var el = e.target.closest("[data-veh],[data-action]"); if (!el) return;
    if (el.hasAttribute("data-veh")) { db.currentVehicleId = el.getAttribute("data-veh"); save(); render(); }
    else if (el.getAttribute("data-action") === "add-car") openVehicleModal(null);
  });
  ["cardsRow", "mgrid", "histWrap"].forEach(function (cid) {
    document.getElementById(cid).addEventListener("click", function (e) {
      var el = e.target.closest("[data-log-type],[data-edit-service],[data-del-service]"); if (!el) return;
      if (el.hasAttribute("data-edit-service")) openServiceModal(el.getAttribute("data-edit-service"));
      else if (el.hasAttribute("data-del-service")) deleteService(el.getAttribute("data-del-service"));
      else if (el.hasAttribute("data-log-type")) openServiceModal(null, el.getAttribute("data-log-type"));
    });
  });

  document.getElementById("logServiceBtn").onclick = function () { openServiceModal(null); };
  document.getElementById("settingsBtn").onclick = function () { openModal("settingsModal"); };
  document.getElementById("photoBtn2").onclick = function () { closeModal("settingsModal"); document.getElementById("photoInput").click(); };
  document.getElementById("intervalsBtn2").onclick = openIntervalsModal;
  document.getElementById("intervalsBtn3").onclick = function () { closeModal("settingsModal"); openIntervalsModal(); };
  document.getElementById("editCarBtn2").onclick = function () { closeModal("settingsModal"); openVehicleModal(db.currentVehicleId); };
  document.getElementById("addCarBtn2").onclick = function () { closeModal("settingsModal"); openVehicleModal(null); };
  document.getElementById("exportBtn").onclick = function () { closeModal("settingsModal"); exportData(); };
  document.getElementById("logoutBtn").onclick = doLogout;

  document.getElementById("photoInput").addEventListener("change", function (e) { if (e.target.files[0]) handlePhoto(e.target.files[0]); e.target.value = ""; });

  document.getElementById("saveServiceBtn").onclick = saveService;
  document.getElementById("saveVehicleBtn").onclick = saveVehicle;
  document.getElementById("deleteVehicleBtn").onclick = deleteVehicle;
  document.getElementById("saveIntervalsBtn").onclick = saveIntervals;
  document.getElementById("svcType").addEventListener("change", toggleCustom);

  document.getElementById("loginBtn").onclick = doLogin;
  document.getElementById("loginUser").addEventListener("keydown", function (e) { if (e.key === "Enter") doLogin(); });
  document.getElementById("loginPass").addEventListener("keydown", function (e) { if (e.key === "Enter") doLogin(); });

  document.querySelectorAll("[data-close]").forEach(function (b) { b.onclick = function () { b.closest(".modal-backdrop").classList.remove("open"); }; });
  document.querySelectorAll(".modal-backdrop").forEach(function (bd) { bd.addEventListener("click", function (e) { if (e.target === bd) bd.classList.remove("open"); }); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") document.querySelectorAll(".modal-backdrop.open").forEach(function (m) { m.classList.remove("open"); }); });
  window.addEventListener("online", function () { if (authed) pushToServer(); });

  render();
  boot();
})();
</script>
</body>
</html>
